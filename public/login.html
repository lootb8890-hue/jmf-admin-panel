<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>تسجيل الدخول — jmf coder</title>
  <meta name="theme-color" content="#00d4aa" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #080c14;
      color: #e6edf3;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* خلفية */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
    }

    .bg-glow-1 { background: #00d4aa; top: -150px; right: -100px; }
    .bg-glow-2 { background: #58a6ff; bottom: -150px; left: -100px; }

    /* بطاقة تسجيل الدخول */
    .login-card {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: 95vw;
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(48, 54, 61, 0.6);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .login-logo-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #00d4aa, #0085ff);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,212,170,0.3);
      position: relative;
    }

    .login-logo-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 23px;
      background: linear-gradient(135deg, #00d4aa, #0085ff, #a371f7);
      z-index: -1;
      opacity: 0.4;
      filter: blur(10px);
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      color: #e6edf3;
    }

    .login-subtitle {
      font-size: 14px;
      color: #8b949e;
      text-align: center;
      margin-top: -8px;
    }

    /* أزرار OAuth */
    .oauth-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border: 1px solid rgba(48, 54, 61, 0.6);
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      color: #e6edf3;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .oauth-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(48, 54, 61, 0.8);
      transform: translateY(-1px);
    }

    .oauth-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .oauth-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .oauth-divider::before,
    .oauth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(48, 54, 61, 0.6);
    }

    .oauth-divider span {
      font-size: 13px;
      color: #656d76;
      white-space: nowrap;
    }

    /* نموذج كلمة المرور */
    .password-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .form-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input-wrap input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: rgba(13, 17, 23, 0.6);
      border: 1px solid rgba(48, 54, 61, 0.6);
      border-radius: 12px;
      color: #e6edf3;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input-wrap input:focus {
      border-color: #00d4aa;
      box-shadow: 0 0 0 3px rgba(0,212,170,0.1);
    }

    .form-input-wrap input::placeholder {
      color: #656d76;
    }

    .toggle-vis {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
    }

    .toggle-vis:hover {
      color: #e6edf3;
    }

    .login-submit {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #00d4aa, #00b894);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(0,212,170,0.3);
    }

    .login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,212,170,0.4);
    }

    .login-submit:active {
      transform: translateY(0);
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      padding: 12px 16px;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 10px;
      color: #f85149;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      animation: shake 0.3s ease-in-out;
    }

    .login-error.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #656d76;
    }

    .login-footer a {
      color: #00d4aa;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* رابط العودة */
    .back-link {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8b949e;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #e6edf3;
    }

    /* حالة التحميل */
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <a href="/splash.html" class="back-link">← العودة</a>

    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">j</div>
        <div>
          <div class="login-title">مرحباً بك</div>
          <div class="login-subtitle">سجّل الدخول للوصول إلى لوحة التحكم</div>
        </div>
      </div>

      <!-- أزرار تسجيل الدخول عبر OAuth -->
      <div class="oauth-section">
        <button class="oauth-btn" onclick="loginWithOAuth('github')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          تسجيل الدخول بـ GitHub
        </button>

        <button class="oauth-btn" onclick="loginWithOAuth('google')">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          تسجيل الدخول بـ Google
        </button>
      </div>

      <div class="oauth-divider">
        <span>أو سجّل بكلمة المرور</span>
      </div>

      <!-- نموذج كلمة المرور -->
      <form class="password-form" id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label>كلمة المرور</label>
          <div class="form-input-wrap">
            <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور..." autofocus />
            <button type="button" class="toggle-vis" onclick="togglePassword()">إظهار</button>
          </div>
        </div>

        <button type="button" class="login-submit" style="background: linear-gradient(135deg, #00d4aa, #0099ff); margin-bottom: 10px;" onclick="quickOwnerLogin()">
          <span>⚡ دخول مباشر كمالك المشروع (بدون كلمة مرور)</span>
        </button>
        <button type="submit" class="login-submit" id="loginBtn">
          <span id="loginBtnText">دخول</span>
          <div class="loading-spinner" id="loginSpinner"></div>
        </button>

        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-footer">
        لا تملك حساباً؟ <a href="#" onclick="showHint()">تواصل مع المسؤول</a>
      </div>
    </div>
  </div>

  <script>
    // التحقق من وجود توكن محفوظ
    const token = localStorage.getItem('admin_token');
    if (token) {
      fetch('/api/auth/verify', {
        headers: { 'X-Admin-Token': token }
      })
      .then(r => r.json())
      .then(data => {
        if (data.valid) {
          window.location.href = '/';
        }
      })
      .catch(() => {});
    }

    function togglePassword() {
      const inp = document.getElementById('loginPassword');
      const btn = document.querySelector('.toggle-vis');
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = 'إخفاء';
      } else {
        inp.type = 'password';
        btn.textContent = 'إظهار';
      }
    }

    async function quickOwnerLogin() {
      try {
        const res = await fetch('/api/auth/local-token');
        const data = await res.json();
        if (data.ok && data.token) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/index.html';
        } else {
          doLoginWithPass('jmf-admin-2024');
        }
      } catch (e) {
        doLoginWithPass('jmf-admin-2024');
      }
    }

    async function doLoginWithPass(pass) {
      document.getElementById('loginPassword').value = pass;
      document.getElementById('loginBtn').click();
    }

    async function doLogin(e) {
      e.preventDefault();
      const password = document.getElementById('loginPassword').value.trim();
      if (!password) return;

      const btn = document.getElementById('loginBtn');
      const text = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      const error = document.getElementById('loginError');

      btn.disabled = true;
      text.style.display = 'none';
      spinner.style.display = 'block';
      error.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.ok && data.token) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/';
        } else {
          showError(data.error || 'كلمة المرور غير صحيحة');
        }
      } catch (e) {
        showError('تعذر الاتصال بالخادم');
      } finally {
        btn.disabled = false;
        text.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    function showError(msg) {
      const error = document.getElementById('loginError');
      error.textContent = msg;
      error.classList.add('show');
      setTimeout(() => error.classList.remove('show'), 4000);
    }

    async function loginWithOAuth(provider) {
      try {
        const res = await fetch('/api/auth/oauth/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider })
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          showError('تعذر إنشاء رابط تسجيل الدخول — تأكد من إعداد ' + provider);
        }
      } catch (e) {
        showError('خطأ في الاتصال بالخادم');
      }
    }

    function showHint() {
      showError('تواصل مع المسؤول للحصول على كلمة المرور');
    }

    // التعامل مع OAuth callback
    const params = new URLSearchParams(window.location.search);
    if (params.get('token')) {
      localStorage.setItem('admin_token', params.get('token'));
      window.location.href = '/';
    }
    if (params.get('error')) {
      showError('فشل تسجيل الدخول: ' + params.get('error'));
    }
  </script>
</body>
</html>
